services:
  app:
    image: php:8.3-fpm-alpine
    container_name: x-ui-api-mini
    command: php-fpm -F -R
    volumes:
      - .:/app
      - /etc/x-ui:/etc/x-ui:rw
      - ./php/fpm-pool.conf:/usr/local/etc/php-fpm.d/zz-root.conf:ro
    working_dir: /app
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: vpn_nginx_ssl
    ports:
      - "11223:11223"
    volumes:
      - .:/app:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/ssl/certs/node-selfsigned.crt:/etc/nginx/ssl/node.crt:ro
      - /etc/ssl/private/node-selfsigned.key:/etc/nginx/ssl/node.key:ro
    depends_on:
      - app
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
